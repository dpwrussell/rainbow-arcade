<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Rainbow Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; padding: 24px 16px;
        font-family: 'Fredoka', ui-rounded, system-ui, sans-serif;
        background: #f3ecff; color: #3a2a6b; text-align: center;
      }
      h1 { font-size: 2.4rem; margin: 8px 0 24px; }
      .games { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
      .card {
        width: 240px; padding: 20px; border: 4px solid #5b3fa8; border-radius: 20px;
        background: white; color: inherit; text-decoration: none;
        box-shadow: 0 4px 16px #5b3fa833; transition: transform 0.15s;
      }
      .card:hover, .card:focus-visible { transform: scale(1.05) rotate(-1deg); }
      .card img, .card span { display: block; width: 96px; height: 96px; margin: 0 auto; font-size: 80px; line-height: 96px; }
      .card h2 { margin: 12px 0 4px; }
      .card p { margin: 0; }
    </style>
  </head>
  <body>
    <h1>🌈 The Rainbow Arcade 🌈</h1>
    <main class="games">
      <!-- GAMES -->
    </main>
  </body>
</html>
